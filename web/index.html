<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Lite (Go + WebSocket)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">
        <div id="login-view">
            <h2>WhatsApp Lite</h2>
            
            <div class="auth-container">
                <div class="error-message" id="error-message"></div>

                <div id="login-form" class="auth-form active">
                    <h3 class="form-title">Login</h3>
                    <input type="text" id="login-username" placeholder="Username" autofocus>
                    <input type="password" id="login-password" placeholder="Password">
                    <button onclick="handleLogin()">Login</button>
                    <div class="toggle-link" onclick="toggleForm()">Don't have an account? Register</div>
                </div>

                <div id="register-form" class="auth-form">
                    <h3 class="form-title">Register</h3>
                    <input type="text" id="register-username" placeholder="Username" autofocus>
                    <input type="password" id="register-password" placeholder="Password">
                    <input type="password" id="register-confirm-password" placeholder="Confirm Password">
                    <button onclick="handleRegister()">Register</button>
                    <div class="toggle-link" onclick="toggleForm()">Already have an account? Login</div>
                </div>
            </div>
        </div>

        <div id="rooms-view">
            <div class="rooms-header">
                <div class="rooms-title">Choose a room</div>
                <div class="rooms-actions">
                    <input type="text" id="new-room-name" placeholder="Create new room">
                    <button onclick="createRoom()">Create</button>
                </div>
            </div>
            <div class="rooms-list" id="rooms-list">
            </div>
        </div>

        <div id="chat-view">
            <div id="header">
                <span id="room-display">Room: General</span>
                <div>
                    <span id="status">Disconnected</span>
                    <button id="leave-room-btn" onclick="leaveRoom()">Leave Room</button>
                </div>
            </div>
            <div id="message-log">
            </div>
            <div id="input-area">
                <input type="text" id="msg-input" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
